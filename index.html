<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centralino del Mistero – Cena con Delitto</title>
<style>
:root {
  --bg: #0d0b0a;
  --panel: #181412;
  --card: #241e1a;
  --border: #4a3c31;
  --gold: #d4af37;
  --gold-glow: rgba(212, 175, 55, 0.25);
  --text: #f3ece0;
  --muted: #a39585;
  --call: #2b7a4b;
  --call-border: #1e5734;
  --end: #8b2525;
  --end-border: #611818;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Georgia', serif;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: clamp(10px, 3vw, 20px);
  background-image: 
    radial-gradient(circle at 50% 10%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
    radial-gradient(circle at 50% 90%, rgba(0, 0, 0, 0.8) 0%, transparent 80%);
}

main {
  width: 100%;
  max-width: 380px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: clamp(16px, 5vw, 24px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--gold-glow);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.header {
  text-align: center;
}

.ico {
  font-size: clamp(2rem, 7vw, 2.5rem);
  line-height: 1.1;
  margin-bottom: 4px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
}

h1 {
  font-size: clamp(1.2rem, 4.5vw, 1.5rem);
  color: var(--gold);
  letter-spacing: 0.05em;
  font-weight: normal;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 4px;
}

p.sub {
  color: var(--muted);
  font-size: clamp(0.75rem, 3vw, 0.85rem);
  font-style: italic;
}

.disp {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  text-align: center;
  font-family: 'Courier New', monospace;
  font-size: clamp(1.4rem, 6vw, 1.8rem);
  letter-spacing: 0.12em;
  color: var(--gold);
  min-height: 2.8rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
}

.st {
  text-align: center;
  color: var(--muted);
  font-size: clamp(0.8rem, 3.2vw, 0.9rem);
  min-height: 1.2rem;
  font-style: italic;
}

.pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(8px, 2.5vw, 12px);
}

.pad button {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 14px;
  font-family: 'Georgia', serif;
  font-size: clamp(1.2rem, 5vw, 1.5rem);
  padding: clamp(10px, 3.5vw, 16px) 0;
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: 0 3px 0 var(--border);
}

.pad button:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--border);
  background: var(--border);
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(8px, 2.5vw, 12px);
  margin-top: 4px;
}

.actions button {
  font-family: 'Georgia', serif;
  font-size: clamp(0.9rem, 3.5vw, 1.05rem);
  font-weight: bold;
  padding: clamp(12px, 3.5vw, 16px) 0;
  border-radius: 14px;
  border: none;
  color: #fff;
  cursor: pointer;
  transition: all 0.15s ease;
}

.actions .call {
  background: var(--call);
  box-shadow: 0 3px 0 var(--call-border);
}

.actions .end {
  background: var(--end);
  box-shadow: 0 3px 0 var(--end-border);
}

.actions button:active {
  transform: translateY(2px);
  box-shadow: none;
}
</style>
</head>
<body>

<main>
  <div class="header">
    <div class="ico">🕵️‍♂️</div>
    <h1>Centralino</h1>
    <p class="sub">Digita il numero e premi Chiama</p>
  </div>

  <div class="disp" id="d" aria-live="polite">&nbsp;</div>
  <div class="st" id="st"></div>

  <div class="pad" id="pad"></div>

  <div class="actions">
    <button class="call" id="call">📞 Chiama</button>
    <button class="end" id="end">✖ Chiudi</button>
  </div>
</main>

<script>
var P={
"0871458921":{n:"Pamela",f:1,p:1.15,r:.95,t:"Pronto? Ah, la polizia... Sì, guardi, sono Pamela, la vicina di Jacopo. L'ho visto rientrare circa quattro ore fa. Sinceramente mi è sembrato parecchio turbato, camminava a passo svelto e balbettava da solo... come se avesse appena avuto una brutta lite con qualcuno. Non mi ha nemmeno salutata."},
"0871892304":{n:"Gabriele",f:0,p:.9,r:1,t:"Pronto, servizio clienti ENEL, sono Gabriele. Guardi, le confermo che abbiamo ricevuto una chiamata strana circa un'ora fa: un utente chiedeva con insistenza di staccare immediatamente il contatore della sede in via dei Crociferi 59 a Chieti. Gli ho spiegato che non possiamo eseguire interventi del genere di domenica sera senza preavviso!"},
"3334920183":{n:"Roberta",f:1,p:1,r:1.05,t:"Pronto? Ciao cara! Ah, volete sapere di lei? Sì, è venuta da me ieri sera, all'ultimo minuto prima della chiusura! Voleva a tutti i costi far cambiare il colore al suo vestito, pretendeva che diventasse rosso acceso ad ogni costo. Non sta a me giudicare le scelte degli altri, ma con la sua carnagione... beh, io penso che le stesse decisamente meglio il verde!"},
"0871341092":{n:"Filippo",f:0,p:1.05,r:.95,t:"Qui parla Filippo, direzione del teatro marrucino. Sì, Alessia mi aveva chiesto la disponibilità per mettere in scena il suo spettacolo, ma purtroppo ho dovuto rifiutare: la sala era già prenotata da tempo per un evento di gala. Tuttavia, per venirle incontro, le ho accordato dei piccoli fondi destinati alla ristrutturazione del teatrino della parrocchia di Sant'Agostino."},
"3478102938":{n:"Andrea",f:0,p:.8,r:1.05,t:"Pronto, Ferramenta Andrea! Ah, per quella ragazza... sì, è venuta ieri pomeriggio. Ha acquistato un telo plastificato molto grande, stivali da lavoro e altri attrezzi un po' particolari. Ho pensato che dovesse cogliere le olive, visto il periodo... ma c'era qualcosa di strano: mentre tirava fuori i contanti per pagarmi, le tremavano visibilmente le mani."},
"3209182734":{n:"Bruna",f:1,p:.85,r:.85,t:"Pronto...? Oh, sono la mamma di Jacopo... sono completamente distrutta, non posso credere a quello che è successo al mio ragazzo. Purtroppo non so dirvi molto, solo che ultimamente mi chiedeva continuamente soldi in prestito. Ho subito pensato che avesse gravi problemi economici... e come madre non potevo certo negarglieli."},
"3381928374":{n:"Francesco",f:0,p:1.1,r:1.1,t:"Ehi pronto, sono Francesco. Sì, con Jacopo ci siamo visti proprio stamattina presto per fare colazione insieme al bar. L'ho trovato nervosissimo, mi ha detto che era sommerso di impegni ma soprattutto che doveva preparare questo grande spettacolo... continuava a ripetere che sarebbe stato l'evento più importante, come se fosse l'ultimo della sua carriera."},
"3298765432":{n:"Marta",f:1,p:1.25,r:1.05,t:"Pronto, sono Marta. Guardate, Jacopo nell'ultimo periodo si sentiva continuamente con Arnaldo e Barbara. Non ho mai capito bene il motivo: diceva per lavoro, ma secondo me c'era sotto qualcosa di personale o amoroso... Chissà, magari con uno dei due! Io ho notato più volte degli sguardi molto strani e un'intensa attrazione tra Barbara e Jacopo."},
"3405678901":{n:"Giuseppe",f:0,p:.75,r:.9,t:"Palestra Bushido, sono Giuseppe. Sì, Arnaldo è uno dei miei allievi migliori. Proprio ieri si è allenato qui da me e ha fatto una sessione fantastica: gli ho mostrato una presa di sottomissione molto complessa e l'ha eseguita alla perfezione al primo tentativo. Gli ripeto sempre, però, che certe tecniche vanno usate esclusivamente per difesa personale."},
"3312345678":{n:"Alessandra",f:1,p:1.1,r:1.15,t:"Pronto! Ahhh, ma allora volete le ultime novità! Io conosco benissimo Barbara, Alessia e Amalia. Dunque: Barbara ha un gusto abominevole nel vestirsi, davvero non mi spiego come faccia ad avere tutti quei corteggiatori! Alessia è sempre molto riservata e schiva, anche se fa la carina e sorride a tutti. Amalia invece... beh, per il lavoro che fa maneggia oggetti decisamente sospetti!"},
"0871654321":{n:"Michelangelo",f:0,p:.88,r:.86,t:"Pronto, Michelangelo. Sì, mi sono accordato personalmente con Jacopo per affittargli il teatrino parrocchiale. All'inizio gli avevo chiesto 800 euro per il weekend, ma lui è scattato subito con toni scontenti ed aggressivi per contrattare sul prezzo. Alla fine ho ceduto e gli ho fatto uno sconto forte... mi faceva quasi pena per quanto sembrava disperato."},
"3487654321":{n:"Paolo",f:0,p:.78,r:1.12,t:"Pronto, sono Paolo il fonico. Ho lavorato per tantissimi anni fianco a fianco con Gianmarco in teatro. Ascoltatemi bene: lui era l'unico in tutta la struttura a conoscere a memoria ogni singolo cavo e la mappatura dei quadri elettrici. Con quelle mani e la sua esperienza, Gianmarco è un vero e proprio mago dell'elettricità."}
};

var num="",d=document.getElementById("d"),st=document.getElementById("st"),V=[],ss=window.speechSynthesis;

function show(){d.innerHTML=num?num.replace(/(\d{3})(\d{0,4})/,"$1 $2"):"&nbsp;"}

var pad=document.getElementById("pad");
["1","2","3","4","5","6","7","8","9","⌫","0","C"].forEach(function(k){
 var b=document.createElement("button");
 b.textContent=k;
 b.onclick=function(){
  if(k==="⌫")num=num.slice(0,-1);
  else if(k==="C")num="";
  else if(num.length<10)num+=k;
  show();
 };
 pad.appendChild(b);
});

function q(v){
 var n=v.name+" "+v.voiceURI,s=0;
 if(/natural|neural|online/i.test(n))s+=3;
 if(/premium|enhanced|migliorata|siri/i.test(n))s+=2;
 if(/google/i.test(n))s+=1;
 return s;
}

function load(){
 V=ss?ss.getVoices().filter(function(v){return /^it/i.test(v.lang.replace("_","-"))}):[];
 V.sort(function(a,b){return q(b)-q(a)});
}

if(ss){load();ss.onvoiceschanged=load}

var FEM=/elsa|isabella|alice|federica|paola|emma|silvia|fiamma|chiara|female|donna/i,
    MAS=/diego|luca|cosimo|marco|roberto|male|uomo/i;

function pick(o){
 var pool=V.filter(function(v){return o.f?FEM.test(v.name):MAS.test(v.name)});
 if(!pool.length)pool=V;
 var same=Object.keys(P).filter(function(k){return P[k].f===o.f}),i=same.indexOf(o.k);
 return pool.length?pool[Math.max(i,0)%pool.length]:null;
}

var run=0;
function say(t,o){
 if(!ss){st.textContent="Audio non supportato su questo dispositivo.";return}
 ss.cancel();
 var id=++run;
 var parts=t.match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g)||[t],v=pick(o),i=0;
 
 function next(){
  if(id!==run)return;
  if(i>=parts.length){st.textContent="Chiamata terminata.";return}
  var s=parts[i++].trim(),u=new SpeechSynthesisUtterance(s);
  u.lang="it-IT";
  if(v)u.voice=v;
  var qm=/\?$/.test(s),ex=/!$/.test(s);
  u.rate=o.r*(0.95+Math.random()*.1)*(ex?1.04:1);
  u.pitch=Math.min(2,o.p*(0.96+Math.random()*.08)*(qm?1.08:1));
  u.volume=1;
  
  var go=function(){
   if(id===run)setTimeout(next,/[,]$/.test(s)?150:260+Math.random()*260);
  };
  u.onend=go;
  u.onerror=go;
  ss.speak(u);
 }
 next();
}

document.getElementById("call").onclick=function(){
 if(!num){st.textContent="Inserisci un numero.";return}
 var c=P[num];
 if(c){
  c.k=num;
  st.textContent="In chiamata...";
  say(c.t,c);
 }else{
  st.textContent="Numero non attivo.";
  say("Il numero da lei chiamato non è al momento raggiungibile. Controlli il numero e riprovi.",{f:1,p:1,r:.95});
 }
};

document.getElementById("end").onclick=function(){
 run++;
 if(ss)ss.cancel();
 st.textContent="";
 num="";
 show();
};

show();
</script>
</body>
</html>
